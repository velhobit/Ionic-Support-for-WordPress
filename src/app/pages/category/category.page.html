<ion-content mode="ios" [fullscreen]="true">
  <ion-grid fixed="true" role="main">
    <!-- Category title -->
    <ion-row>
      <ion-col class="ion-padding-start">
        <ion-skeleton-text
          *ngIf="loading"
          [animated]="true"
          style="width: 50%; height: 30px; margin: 1rem auto"
          aria-hidden="true"
        ></ion-skeleton-text>

        <header *ngIf="!loading">
          <h2 class="ion-no-margin cat-title">{{ cat_name }}</h2>
        </header>
      </ion-col>
    </ion-row>

    <!-- Loading state -->
    <ion-row *ngIf="loading" aria-busy="true">
      <ion-col
        class="ion-padding flex-vertical"
        size="12"
        size-md="6"
        size-lg="4"
      >
        <ion-card class="ion-no-margin flex-vertical" aria-hidden="true">
          <ion-card-content class="thumbnail ion-no-margin">
            <ion-skeleton-text
              [animated]="true"
              style="width: 100%; height: 100px"
            ></ion-skeleton-text>
          </ion-card-content>

          <ion-card-header>
            <ion-skeleton-text
              [animated]="true"
              style="width: 50%; height: 1em"
            ></ion-skeleton-text>
            <ion-skeleton-text
              [animated]="true"
              style="width: 100%; height: 1em"
            ></ion-skeleton-text>
          </ion-card-header>
        </ion-card>
      </ion-col>
    </ion-row>

    <!-- Empty state -->
    <ion-row *ngIf="!loading && !posts.length">
      <ion-col>
        <section role="status">
          <h4>No posts were found in this category.</h4>
        </section>
      </ion-col>
    </ion-row>

    <!-- Posts list -->
    <ion-row *ngIf="posts.length">
      <ion-col
        class="ion-padding flex-vertical"
        size="12"
        size-md="6"
        size-lg="4"
        *ngFor="let post of posts"
      >
        <article>
          <ion-card
            class="ion-no-margin flex-vertical"
            [routerLink]="[
              '/post',
              post?.categories[0]?.slug,
              post?.slug
            ]"
            role="link"
            tabindex="0"
            [attr.aria-label]="'Open post: ' + post?.title"
          >
            <ion-card-content class="thumbnail ion-no-margin">
              <img
                *ngIf="post?.thumbnail?.url?.length"
                [src]="post.thumbnail.url"
                [alt]="post.title"
              />
            </ion-card-content>

            <ion-card-header *ngIf="post?.categories">
              <div>
                @for (cat of post.categories; track cat) {
                <ion-chip
                  color="primary"
                  [routerLink]="['/category', cat.slug]"
                  clickable
                  [attr.aria-label]="'Category: ' + cat.name"
                >
                  {{ cat.name }}
                </ion-chip>
                }
              </div>

              <ion-card-title [innerHTML]="post.title"></ion-card-title>
            </ion-card-header>
          </ion-card>
        </article>
      </ion-col>
    </ion-row>
  </ion-grid>

  <app-footer></app-footer>
</ion-content>
