<ion-content [fullscreen]="true">
  <ion-grid fixed="true" class="post">
    <ion-row>
      <ion-col>
        <header>
          <h1 *ngIf="post">{{post?.title}}</h1>
          <h1 *ngIf="!post">
            <ion-skeleton-text
              [animated]="true"
              style="width: 100%; height: 36px"
            ></ion-skeleton-text>
            <ion-skeleton-text
              [animated]="true"
              style="width: 50%; height: 36px"
            ></ion-skeleton-text>
          </h1>
          <time *ngIf="!post" class="ion-margin-bottom">
            <ion-skeleton-text
              [animated]="true"
              style="width: 35%; height: 36px"
            ></ion-skeleton-text>
          </time>
          <time
            [attr.datetime]="post.published_date"
            *ngIf="post?.publishedDateRendered && post?.publishedDateRendered != undefined"
            class="ion-margin-bottom"
          >
            {{post?.publishedDateRendered}}
          </time>
        </header>
        <div class="content" id="postContent" [innerHTML]="post?.content"></div>
        <div class="content" *ngIf="!post">
          <p *ngFor="let a of [0,0,0]">
            <ion-skeleton-text
              [animated]="true"
              style="height: 16px"
              *ngFor="let a of [0,0,0,0]"
            >
            </ion-skeleton-text>
          </p>
          <ion-skeleton-text [animated]="true" style="height: 200px">
          </ion-skeleton-text>
          <p *ngFor="let a of [0,0,0]">
            <ion-skeleton-text
              [animated]="true"
              style="height: 16px"
              *ngFor="let a of [0,0,0,0]"
            >
            </ion-skeleton-text>
          </p>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
